# Render Blueprint: one Go web service (backend) and one static site (frontend).
# Steps and the webhook registration are in DEPLOY.md.
services:
  - type: web
    name: fourhour-api
    runtime: go
    plan: free
    buildCommand: cd backend && go build -o ../bin/fourhour ./cmd/fourhour
    startCommand: ./bin/fourhour
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ARTIFACTS_DIR
        value: ./artifacts
      - key: DATABASE_URL
        value: ./fourhour.db
      - key: DEMO_VAULT_TOKEN
        sync: false
      - key: SANDBOX_MEMBER_EMAIL
        sync: false
      - key: SANDBOX_PAYOUT_EMAIL
        sync: false

  - type: web
    name: fourhour-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_USE_MOCK
        value: "false"
